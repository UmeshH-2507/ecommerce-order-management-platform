services:

  postgres:
    image: postgres:17
    container_name: ecommerce-product-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: product_db
      PGDATA: /var/lib/postgresql/data
    volumes:
      - product-postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

  kafka:
    image: apache/kafka:4.0.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - ecommerce-network

  eureka-server:
    image: eureka-server:1.0
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - ecommerce-network

  product-service:
    image: product-service:1.2
    container_name: product-service
    ports:
      - "8081:8081"
    networks:
      - ecommerce-network

  user-service:
    image: user-service:1.0
    container_name: user-service
    ports:
      - "8082:8082"
    networks:
      - ecommerce-network

  cart-service:
    image: cart-service:1.0
    container_name: cart-service
    ports:
      - "8083:8083"
    networks:
      - ecommerce-network

  order-service:
    image: order-service:1.2
    container_name: order-service
    ports:
      - "8084:8084"
    networks:
      - ecommerce-network

  inventory-service:
    image: inventory-service:1.0
    container_name: inventory-service
    ports:
      - "8085:8085"
    networks:
      - ecommerce-network

  payment-service:
    image: payment-service:1.0
    container_name: payment-service
    ports:
      - "8086:8086"
    networks:
      - ecommerce-network

  notification-service:
    image: notification-service:1.0
    container_name: notification-service
    ports:
      - "8087:8087"
    networks:
      - ecommerce-network

  api-gateway:
    image: api-gateway:1.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network

volumes:
  product-postgres-data:
    external: true

  kafka-data:
    external: true
    name: 83da8b8c90f4889afec1e21e5424e946550ced809806b13fedea45678f2f2f10

networks:
  ecommerce-network:
    external: true